name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - '[0-9]*.x'
  # Weekly, to catch new Drupal and Drush releases and new zizmor findings.
  schedule:
    - cron: 0 0 * * 1
  workflow_dispatch:

permissions: {}

# Cancel superseded runs on the same branch or PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  functional:
    # Job names are the ci ruleset's required checks: update it when they change.
    name: Drupal ${{ matrix.drupal }}, Drush ${{ matrix.drush }}, PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    permissions:
      contents: read # Check out the repository.
    strategy:
      fail-fast: false
      matrix:
        # Each Drush major on the lowest PHP it allows, with its oldest Drupal major,
        # and on the newest PHP it passes on, with its newest Drupal major.
        include:
          - drupal: 10
            drush: 12
            php: '8.1'
          - drupal: 10
            drush: 12
            php: '8.6'
          - drupal: 10
            drush: 13
            php: '8.3'
          - drupal: 11
            drush: 13
            php: '8.6'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          tools: composer
      - run: tests/functional.sh
        env:
          DRUPAL_VERSION: ${{ matrix.drupal }}
          DRUSH_VERSION: ${{ matrix.drush }}

  lint-actions:
    name: Lint actions
    runs-on: ubuntu-latest
    permissions:
      contents: read # Check out the repository.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color -verbose # List the checked files, since a clean run prints nothing.
      - name: Run zizmor
        if: ${{ !cancelled() }} # Also report zizmor's findings when actionlint fails.
        uses: zizmorcore/zizmor-action@1b4550e929643b8b26a62303c6bd64814271a4f1 # v0.9.2
        with:
          # Report findings in the job log instead of uploading to code scanning.
          advanced-security: false
          persona: auditor
